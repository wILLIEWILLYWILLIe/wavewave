version: '3.8'
services:
  mqtt-broker:
    container_name: mqtt_broker
    restart: always
    build: mqtt/.
    ports:
      - "9001:9001"
      - "1883:1883"
    networks:
      - db_network
      - web_network
  frontend:
    container_name: frontend
    restart: always
    build: .
    ports:
      - "80:5005"
    networks:
      - db_network
      - web_network
    volumes:
    - ./.env:/.env
    - ./ishield_aoa_frontend.sqlite3:/ishield_aoa_frontend.sqlite3
    depends_on:
      - mqtt-broker
  # nginx:
  #   container_name: nginx
  #   restart: always
  #   image: "nginx:latest"
  #   ports:
  #     - "8080:5085"
  #   volumes:
  #     - ./nginx:/etc/nginx/conf.d
  #   networks:
  #     - web_network
  #   depends_on: 
  #     - ishield-aoa-frontend
networks:
  db_network:
    driver: bridge
  web_network:
    driver: bridge
 